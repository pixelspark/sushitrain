name: "Build iOS+macOS app"

on:
  pull_request:
  push:

env:
  GO_VERSION: "~1.27.0"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    # See https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    # and https://github.com/actions/runner-images#available-images
    runs-on: xcode-27
    steps:
      - name: Check Xcode version
        run: |
          /usr/bin/xcodebuild -version
          sudo /usr/bin/xcode-select -switch /Applications/Xcode_27.0.app
          xcrun simctl list > /dev/null
          /usr/bin/xcodebuild -version

      - name: Install iOS platform
        run: |
          xcodebuild -downloadPlatform iOS

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Lint
        run: |
          make lint

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: true

      - name: Build core
        run: |
          make core

      - name: Build for iOS and macOS
        run: |
          make ios mac
          make cleanup

      - name: Package application
        run: |
          mkdir -p dist
          /usr/bin/ditto -c -k --keepParent Build "dist/sushitrain-${{ github.sha }}.zip"
          shasum -a 256 "dist/sushitrain-${{ github.sha }}.zip"

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/sushitrain-${{ github.sha }}.zip

      - name: Attach build to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: dist/sushitrain-${{ github.sha }}.zip
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$RELEASE_ASSET" --clobber
          else
            gh release create "${{ github.ref_name }}" "$RELEASE_ASSET" \
              --draft \
              --title "${{ github.ref_name }}" \
              --notes "Automated build for ${{ github.ref_name }}"
          fi

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/sushitrain-${{ github.sha }}.zip
          retention-days: 3
